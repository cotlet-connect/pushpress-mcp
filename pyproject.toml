[project]
name = "pushpress-mcp"
version = "1.0.0"
description = "Unofficial PushPress API integration and MCP server by Cotlet: gym-owner jobs and your own Custom API."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["pushpress", "pushpress api", "pushpress mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/pushpress-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=pushpress"
Source = "https://github.com/cotlet-connect/pushpress-mcp"

[project.scripts]
pushpress-mcp = "pushpress_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"pushpress_agent.py" = "pushpress_agent.py"

[tool.hatch.build.targets.sdist]
include = ["pushpress_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "examples", ".cursor"]
